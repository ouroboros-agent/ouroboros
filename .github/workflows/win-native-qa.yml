# Temporary release qualification for razzant/ouroboros#2051 (lives only on a qa/ branch of the
# ouroboros-agent fork and its draft PR; never merged). Runs the opt-in native launcher handoff and tray icon proof
# on a hosted Windows desktop and fails when any case is skipped, so a green run means executed asserts.
name: Windows native QA
on:
  push:
    branches: ["qa/win-native-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      # The proof's children run on the base interpreter (a venv redirector would add a console client),
      # with PYTHONPATH set to the checkout only, so the project's dependencies must live there too.
      - name: Base interpreter dependencies
        shell: bash
        run: |
          base="$(python -c "import sys; print(getattr(sys, '_base_executable', sys.executable))")"
          echo "base interpreter: $base"
          uv pip install --python "$base" -e . pythonnet
          uv pip install pythonnet  # the icon case imports clr in the test process itself
          "$base" -c "import sys; sys.path.insert(0, '.'); from ouroboros import launcher_bootstrap; import clr; print('base imports ok')"
      - name: Native launcher handoff and tray icon proof
        shell: bash
        env:
          OUROBOROS_WINDOWS_DESKTOP_QA: "1"
        run: |
          python -m pytest -o addopts="" -p no:cacheprovider -v -rA --junitxml=native-qa.xml tests/test_windows_launcher_handoff_native.py
      - name: Every case executed
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("native-qa.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          counts = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print(counts)
          sys.exit(1 if counts["tests"] == 0 or counts["skipped"] or counts["failures"] or counts["errors"] else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qa
          path: native-qa.xml
